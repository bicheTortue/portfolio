<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta
      name="description"
      content="Valentin Barbaza — PhD student in Electronics. Research, publications, and contact information."
    />
    <title>{{ page.title }} | Researcher Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#172b35',
              muted: '#60727a',
              paper: '#f7f8f5',
              line: '#dfe6e2',
              accent: '#147d72',
              pale: '#e5f1ed'
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              serif: ['Georgia', 'ui-serif', 'serif']
            },
            boxShadow: {
              soft: '0 16px 50px rgba(23,43,53,.06)'
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  </head>
  <body
    data-page-title="{{ page.title }}"
    class="bg-paper font-sans text-ink antialiased selection:bg-pale selection:text-ink"
  >
    <div class="mx-auto min-h-screen max-w-7xl px-5 sm:px-8 lg:px-12">
      <header class="site-header">
        <a
          href="{{ '/' | relative_url }}"
          class="site-brand"
          aria-label="Valentin Barbaza home"
        >
          <span class="brand-mark">VB</span>
          <span class="text-sm font-semibold tracking-tight" data-profile-text="name">
            Valentin Barbaza
          </span>
        </a>
        <nav id="site-nav" class="site-nav" aria-label="Main navigation"></nav>
        <div class="header-actions">
          <a
            href="mailto:your.email@university.edu"
            data-profile-email-link
            class="header-contact"
          >
            Get in touch <span aria-hidden="true">↗</span>
          </a>
          <button
            id="menu-toggle"
            class="menu-toggle"
            aria-expanded="false"
            aria-controls="site-nav"
          >
            <span class="menu-toggle-label">Menu</span>
            <span class="menu-toggle-icon" aria-hidden="true">☰</span>
          </button>
        </div>
      </header>

      <div
        class="grid gap-10 py-8 md:grid-cols-[220px_minmax(0,1fr)] md:gap-14 md:py-14 lg:grid-cols-[250px_minmax(0,1fr)] lg:gap-20"
      >
        <aside class="md:sticky md:top-8 md:h-fit">
          <div class="flex items-center gap-4 md:block">
            <div
              class="relative h-20 w-20 shrink-0 overflow-hidden rounded-2xl bg-pale
                md:mb-6 md:aspect-square md:h-auto md:w-full md:rounded-3xl"
            >
              <img
                src="{{ '/images/profil.jpg' | relative_url }}"
                data-profile-image
                class="h-full w-full object-cover object-[center_28%]"
                alt="Portrait of Valentin Barbaza"
              />
              <span
                class="absolute bottom-2 right-3 h-3 w-3 rounded-full border-2 border-paper bg-accent md:bottom-4 md:right-4 md:h-4 md:w-4"
                title="Open to research conversations"
              ></span>
            </div>
            <div>
              <p class="font-serif text-xl md:text-2xl" data-profile-text="name">
                Valentin Barbaza
              </p>
              <p class="mt-1 text-sm leading-6 text-muted" data-profile-text="role">PhD student in Electronics</p>
            </div>
          </div>
          <p class="mt-6 hidden text-sm leading-7 text-muted md:block">
            Researching the ideas and technologies shaping the next generation of electronic systems.
          </p>
          <div class="mt-9 hidden border-t border-line pt-5 md:block">
            <p class="text-xs font-semibold uppercase tracking-[.16em] text-muted">Based in</p>
            <p class="mt-2 text-sm" data-profile-text="city">[City, Country]</p>
            <div class="mt-5 flex gap-4 text-sm text-muted">
              <a
                class="transition hover:text-accent"
                href="https://www.linkedin.com/"
                data-profile-href="linkedinUrl"
                target="_blank"
                rel="noreferrer"
              >
                LinkedIn ↗
              </a>
            </div>
          </div>
        </aside>

        <main class="min-w-0">
          {{ content }}
          <footer
            class="mt-16 flex flex-col gap-2 border-t border-line py-6 text-xs text-muted sm:flex-row sm:items-center sm:justify-between"
          >
            <span>
              © <span id="year"></span>
              <span data-profile-text="name">Valentin Barbaza</span>
            </span>
            <span>Built for curiosity and collaboration.</span>
          </footer>
        </main>
      </div>
    </div>
    <script src="{{ '/profile.js' | relative_url }}" defer></script>
    <script src="{{ '/site.js' | relative_url }}" defer></script>
  </body>
</html>
