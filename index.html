<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Researcher Portfolio</title>
    <style>
body { font-family: sans-serif; max-width: 800px; margin: 40px auto; line-height: 1.6; }
.paper { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #ddd; }
.paper-title { font-weight: bold; font-size: 1.1em; }
.paper-meta { color: #666; font-size: 0.9em; }
    </style>
  </head>
  <body>

    <h1>Valentin BARBAZA</h1>
    <p>PhD student in Electronics</p>

    <h2>Automated Publications</h2>
    <div id="publications">Loading publications...</div>

    <script>
      // Replace with your Semantic Scholar Author ID
      // (Search your name on semanticscholar.org to find your numeric ID in the URL)
      const AUTHOR_ID = "2383172305";

      async function fetchPublications() {
        const container = document.getElementById('publications');
        try {
          const response = await fetch(`https://api.semanticscholar.org/graph/v1/author/${AUTHOR_ID}/papers?fields=title,year,authors,venue,url`);
          const data = await response.json();

          container.innerHTML = ''; // Clear loading state

          data.data.forEach(paper => {
            const div = document.createElement('div');
            div.className = 'paper';

            const authors = paper.authors.map(a => a.name).join(', ');

            div.innerHTML = `
            <div class="paper-title"><a href="${paper.url}" target="_blank">${paper.title}</a></div>
            <div class="paper-meta">${authors} (${paper.year || 'N/A'})</div>
            <div class="paper-meta"><em>${paper.venue || 'Preprint/Journal'}</em></div>
          `;
            container.appendChild(div);
          });
        } catch (err) {
          container.innerHTML = '<p>Failed to load publications from Semantic Scholar.</p>';
          console.error(err);
        }
      }

      fetchPublications();
    </script>
  </body>
</html>
